<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> TaskClean - Minhas Tarefas</title>

    <link rel="stylesheet" href="Tela4Terefas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header class="cabecalho">

        <div class="logo">
            <div class="logo-icon">✓</div>
            <h1>TaskClean</h1>
        </div>

        <div class="usuario">
            <span>Olá, usuário!</span>
            <button id="sair">Sair</button>
        </div>

    </header>


    <main class="principal">
        

        <div class="titulo">

            <div>
                <h2>Minhas tarefas</h2>
                <p>Organize suas atividades do dia.</p>
            </div>

        </div>
        
        <div id="liveAlertPlaceholder"></div>

        <div class="contanier-xl" id="adicionar">
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Digite o Topico</label>
                <input type="text" class="form-control" id="tarefaInput" placeholder="Ex: Matematica">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Digite a Descrição</label>
                <textarea class="form-control" id="descricao" rows="3" style="resize: none;" placeholder="25+25 = ?"></textarea>
            </div>
            <div class="text-center">
                <button type="button" class="btn btn-success" id="adicionarBtn">Adicionar</button>
            </div>
            

        </div>


        <div class="filtros">

            <button class="filtro ativo" data-filtro="todas">
                Todas
            </button>

            <button class="filtro" data-filtro="pendentes">
                Pendentes
            </button>

            <button class="filtro" data-filtro="concluidas">
                Concluídas
            </button>

        </div>

        <div class="container text-center">
            <div class="row align-items-start " id="lista" style="gap: 5px;">
        
                
            </div>
        </div>
        
        
        


        <div class="sem-tarefas" id="semTarefas">

            <div class="icone-vazio">✓</div>

            <h3>Nenhuma tarefa encontrada</h3>

            <p>
                Adicione uma tarefa para começar.
            </p>

        </div>

        <!-- Modal de confirmação de exclusão -->
        <div class="modal fade" id="modalExcluir" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content text-center p-3">
                    <div class="modal-body">
                        <h4>Excluir tarefa?</h4>
                        <p id="textoExcluir" class="text-muted mb-0"></p>
                    </div>
                    <div class="modal-footer justify-content-center border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="confirmarExcluir">Sim, excluir</button>
                    </div>
                </div>
            </div>
        </div>

    </main>


    <footer>

        <p>
            © 2026 TaskClean. Todos os direitos reservados para José Matheus.
        </p>

    </footer>

    
    
    
    <script src="Tela4Taresfas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
       
</body>

</html>
